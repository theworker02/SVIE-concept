[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svie-physics"
version = "1.3.1"
description = "SVIE thermodynamic and fluid-dynamics models for supercritical flash-vaporization powertrains"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — SVIE Advanced Engineering Research" }
authors = [{ name = "SVIE Advanced Engineering" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
svie-air-fuel = "svie_physics.air_fuel:main"
svie-hex = "svie_physics.heat_exchanger:main"
svie-hem = "svie_physics.hem_choked_flow:main"
svie-piezo = "svie_physics.piezo_dynamics:main"
svie-driver = "svie_physics.piezo_driver:main"
svie-chassis = "svie_physics.chassis_torsion:main"
svie-hert = "svie_physics.hert_expansion:main"
svie-gdsa = "svie_physics.gdsa_shift:main"
svie-gears = "svie_physics.gear_map:main"
svie-breakthrough = "svie_physics.breakthrough:main"
svie-architecture = "svie_physics.engine_architecture:main"
svie-deva = "svie_physics.deva_power:main"
svie-h2 = "svie_physics.h2_combustion:main"
svie-bom = "svie_physics.bom_cost:main"
svie-cvt = "svie_physics.cvt_comparison:main"
svie-axiom = "svie_physics.axiom_drive:main"
svie-nexus = "svie_physics.nexus_48:main"
svie-sonic = "svie_physics.sonic_nvh:main"
svie-ops = "svie_physics.chronos_sentinel:main"
svie-control = "svie_physics.blend_mirage_vector:main"
svie-demo = "svie_physics.demo:main"
svie-inventory = "svie_physics.inventory:main"
svie-platform = "svie_physics.platform_features:main"
svie-mfg = "svie_physics.manufacturing:main"
svie-validate = "svie_physics.validate:main"
svie-addons = "svie_physics.addon_features:main"
svie-design = "svie_physics.design_system:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
