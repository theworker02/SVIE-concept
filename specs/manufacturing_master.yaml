# Manufacturing master SoT — process routes & capacity

meta:
  id: manufacturing_master
  name: SVIE Manufacturing Master Plan
  version: "1.3.0"
  status: concept-engineering-baseline
  annual_units_assumption: 5000

philosophy:
  cast_forge_volume: true
  additive_geometry: true
  coat_friction: true
  bond_mass: true

engine_routes:
  block:
    alloy: A356-T6
    process: sand_or_spmc
    bore_coating: PTWA
    ptwa_thickness_mm: 0.15
    critical_cylindricity_um: 8
  heads:
    bulk: AlSi_cast
    inserts: LPBF_conformal
    join: hip_or_braze
  cryo_rail:
    material: 316L
    pcm_window_c: [290, 310]
    leak_rate_mbar_l_s: 1.0e-6
  ring_zero:
    top_ring: steel_nitrided_dlc
    dlc_um: [1.5, 3.0]
  oil_spine:
    cleanliness_iso4406: "16/14/11"

transmission_routes:
  case: A380_hpdc_or_sand
  flux_shift_clutch: wet_multiplate
  gear_mesh_am:
    process: LPBF
    alloy: 17-4PH_or_Ti64
    post: HIP_CNC
  jet_bearing: gun_drill_orifices

body_routes:
  tub: CFRP_autoclave_or_rtm
  nodes: A356_cast
  join: adhesive_plus_mechanical
  aero_skin: prepreg_foam_core
  cell_vault: al_extrusion_cfrp_shear
  thermal_skin: microchannel_laminate

cells:
  - id: block_ptwa
    capex_order: high
  - id: head_lpbf
    capex_order: high
  - id: trans_gear
    capex_order: medium
  - id: cfrp_node
    capex_order: high
  - id: final_assembly
    capex_order: medium

golden:
  annual_units: 5000
  ptwa_mm: 0.15
  route_count: 15
  cell_count: 5
