# SVIE 9-Speed Electro-Hydraulic Multi-Clutch Automatic (9A-MC)

meta:
  id: 9a_mc
  name: 9-Speed Electro-Hydraulic Multi-Clutch Automatic
  version: "0.1.0"
  audience: performance-gt / hybrid-compatible

architecture:
  gearsets: 3 planetary
  clutch_packs: 6 electro-hydraulic
  launch_device: wet multi-plate clutch (no torque converter)
  shift_execution_ms: 40
  features:
    - sequential pre-select
    - shift-skip kickdown (e.g. 9→3)
    - zero torque interruption on linear upshifts

gear_ratios:
  "1": 4.710
  "2": 3.140
  "3": 2.250
  "4": 1.680
  "5": 1.280
  "6": 1.000
  "7": 0.820
  "8": 0.690
  "9": 0.580

final_drive: 3.550

notes: >
  Compact planetary automatic engineered for SVIE lean-burn efficiency
  tracking without CVT rubber-band response.
