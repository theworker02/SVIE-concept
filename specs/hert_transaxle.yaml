# Hydrogen-Expanded Reactive Transaxle (HERT-12-HD)
schema_version: "1.0"
meta:
  id: hert_transaxle
  transaxle_id: HERT-12-HD
  description: >
    Hydrogen-Expanded Reactive Transaxle with integrated pressure-recovery
    impulse turbine, Catalytic Exothermic Boost (CEB), and Gas-Dynamic Shift
    Actuation (GDSA) scavenging into the SVIE intake plenum.

