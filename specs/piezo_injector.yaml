# SVIE piezoelectric sonic flash-expansion injector

meta:
  id: piezo_injector
  name: Piezoelectric Sonic Flash Expansion Orifice
  version: "0.1.0"

upstream_state:
  p1_mpa: 7.0
  t1_c: 310
  t1_k: 583.15
  density_kg_m3: 520
  enthalpy_kj_kg: 850
  speed_of_sound_m_s: 650

throat_state:
  p_sat_mpa: 3.2

downstream_state:
