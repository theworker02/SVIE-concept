# AXIOM — Absolute eXergy Indexed Orthogonal Mechanism
# Brand-new fixed-ratio drive that replaces CVT with HERT dog gears + optional e-motor fill
# Deliberately opposite Honda S+ Shift: real ratio steps, not simulated RPM

meta:
  id: axiom_drive
  name: AXIOM Fixed-Ratio Exergy Drive
  version: "0.1.0"
  status: concept-new-system
  replaces: belt CVT / eCVT rubber-band path
  pairs_with: HERT-12-HD

architecture:
  primary: 12-speed dog + pneumatic splitter (HERT)
  optional_torque_fill: single dry clutch + 25 kW e-machine on input (HAMT-class)
  shift_feel: mechanical face-dog engagement with GDSA 4 ms pneumatics
  rev_match: HERT turbine pulse + DEVA throttle air map (not software fake gears)

performance_claims:
  mech_efficiency: 0.965
  shift_ms: 4.0
  max_input_nm: 850
  rubber_band_index: 0.0   # 0 = none; CVT ~1.0 by definition
  driver_engagement_index: 0.95

comparison_to_honda_s_plus:
  honda_s_plus: software RPM shaping on electric CVT without discrete gears
  axiom: discrete ratios with measured RPM drops (1011–1629 @ 8500 shift)
  advantage: authentic acoustic/mechanical feedback + higher mech η + no belt torque ceiling

golden:
  eta: 0.965
  shift_ms: 4.0
  rubber_band_index: 0.0
