# Thermal management & dry-sump oil for SVIE-V8-HR 10,000 RPM

meta:
  id: thermal_oil_system
  name: High-RPM Thermal and Lubrication System
  version: "0.1.0"
  engine_family: svie_v8_hr_357

cooling:
  primary_loop: dual-bank with head-priority LPBF conformal jackets
  coolant: 50/50 EGW
  target_head_metal_c_max: 220
  target_injector_boss_c_max: 140
  oil_cooler_kw_at_wot: 18.0
  radiator_reject_kw_at_wot: 95.0

lubrication:
  type: dry_sump 3-stage scavenge + pressure
  oil: 5W-40 ester blend high-shear
  pressure_bar_hot_idle: 2.8
  pressure_bar_wot_10000: 6.5
  gallery_feed: main → rod → piston oil jets (H2 hotspot control)
  capacity_l: 8.5
  aeration_limit_pct: 8.0

heat_reject_split_fraction:
  coolant: 0.55
  oil: 0.15
  exhaust: 0.30

golden:
  oil_pressure_wot_bar: 6.5
  oil_cooler_kw: 18.0
  injector_boss_c_max: 140
